<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .game-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .score-panel {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        #score {
            color: #e74c3c;
        }

        #high-score {
            color: #f39c12;
        }

        #game-board {
            border: 3px solid #333;
            background: #2c3e50;
            display: block;
            margin: 0 auto;
        }

        .controls {
            margin-top: 20px;
            text-align: center;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.3);
        }

        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .instructions {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }

        .key {
            display: inline-block;
            padding: 3px 8px;
            background: #f0f0f0;
            border-radius: 3px;
            margin: 0 2px;
            font-family: monospace;
            border: 1px solid #ddd;
        }

        #game-over-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            color: #e74c3c;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>🐍 贪吃蛇游戏</h1>

    <div class="game-container">
        <div class="score-panel">
            <span>分数: <span id="score">0</span></span>
            <span>最高分: <span id="high-score">0</span></span>
        </div>

        <canvas id="game-board" width="400" height="400"></canvas>

        <div class="controls">
            <button id="start-btn">开始游戏</button>
            <div class="instructions">
                使用方向键 <span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> 控制移动
            </div>
        </div>
    </div>

    <div id="game-over-modal">
        <div class="modal-content">
            <h2>游戏结束!</h2>
            <div class="final-score">
                最终分数: <span id="final-score">0</span>
            </div>
            <button id="restart-btn">重新开始</button>
        </div>
    </div>

    <script>
        // 游戏配置
        var GAME_CONFIG = {
            gridSize: 20,
            gameSpeed: 150,
            boardWidth: 400,
            boardHeight: 400,
            tileCount: 20
        };

        // 游戏状态
        var snake = [];
        var food = {};
        var direction = 'right';
        var nextDirection = 'right';
        var score = 0;
        var highScore = localStorage.getItem('snakeHighScore') || 0;
        var gameInterval = null;
        var isGameRunning = false;
        var isGameOver = false;

        // Canvas 相关
        var canvas = document.getElementById('game-board');
        var ctx = canvas.getContext('2d');
        var gridSize = GAME_CONFIG.gridSize;
        var tileCount = GAME_CONFIG.boardWidth / gridSize;

        // DOM 元素
        var scoreElement = document.getElementById('score');
        var highScoreElement = document.getElementById('high-score');
        var startButton = document.getElementById('start-btn');
        var restartButton = document.getElementById('restart-btn');
        var gameOverModal = document.getElementById('game-over-modal');
        var finalScoreElement = document.getElementById('final-score');

        // 初始化最高分显示
        highScoreElement.textContent = highScore;

        /**
         * 初始化游戏蛇
         * 蛇由多个格子组成，初始位置在中心向左延伸
         * 这样第一次向右移动后，蛇头不会碰到蛇身
         */
        function initSnake() {
            snake = [];
            var startX = Math.floor(tileCount / 2);
            var startY = Math.floor(tileCount / 2);
            // 从中心向左延伸，第一次向右移动后安全
            for (var i = 0; i < 5; i++) {
                snake.push({x: startX - i, y: startY});
            }
        }

        /**
         * 生成食物
         * 食物随机生成在游戏区域内，不与蛇身重叠
         */
        function generateFood() {
            var newFood;
            var isValidPosition = false;

            while (!isValidPosition) {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

                // 检查是否与蛇身重叠
                isValidPosition = true;
                for (var i = 0; i < snake.length; i++) {
                    if (snake[i].x === newFood.x && snake[i].y === newFood.y) {
                        isValidPosition = false;
                        break;
                    }
                }
            }
            food = newFood;
        }

        /**
         * 绘制游戏画面
         * 包括游戏区域背景、蛇、食物
         */
        function draw() {
            // 清空画布
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制蛇
            for (var i = 0; i < snake.length; i++) {
                // 蛇头颜色深一点
                if (i === 0) {
                    ctx.fillStyle = '#27ae60';
                } else {
                    ctx.fillStyle = '#2ecc71';
                }
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 1, gridSize - 1);
            }

            // 绘制食物（红色圆形）
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            var foodX = food.x * gridSize + gridSize / 2;
            var foodY = food.y * gridSize + gridSize / 2;
            ctx.arc(foodX, foodY, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }

        /**
         * 移动蛇
         * 根据当前方向更新蛇的位置
         */
        function moveSnake() {
            direction = nextDirection;

            // 计算新的头部位置
            var head = {x: snake[0].x, y: snake[0].y};
            switch (direction) {
                case 'up':
                    head.y--;
                    break;
                case 'down':
                    head.y++;
                    break;
                case 'left':
                    head.x--;
                    break;
                case 'right':
                    head.x++;
                    break;
            }

            // 检测碰撞（边界）
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            // 检测碰撞（自身）
            for (var i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }

            // 在蛇头添加新位置
            snake.unshift(head);

            // 检测是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;

                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }

                generateFood();
            } else {
                // 没吃到食物，移除蛇尾
                snake.pop();
            }

            // 重绘游戏画面
            draw();
        }

        /**
         * 开始游戏
         * 初始化游戏状态，开始游戏循环
         */
        function startGame() {
            // 重置游戏状态
            score = 0;
            scoreElement.textContent = score;
            isGameRunning = true;
            isGameOver = false;
            direction = 'right';
            nextDirection = 'right';

            // 初始化蛇和食物
            initSnake();
            generateFood();

            // 隐藏模态框
            gameOverModal.style.display = 'none';

            // 禁用开始按钮
            startButton.disabled = true;

            // 启动游戏循环
            if (gameInterval) {
                clearInterval(gameInterval);
            }
            gameInterval = setInterval(moveSnake, GAME_CONFIG.gameSpeed);

            // 开始绘制
            draw();
        }

        /**
         * 结束游戏
         * 显示游戏结束界面
         */
        function endGame() {
            isGameRunning = false;
            isGameOver = true;

            // 停止游戏循环
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }

            // 显示游戏结束界面
            finalScoreElement.textContent = score;
            gameOverModal.style.display = 'flex';

            // 启用开始按钮
            startButton.disabled = false;
        }

        /**
         * 重置游戏
         * 重置所有游戏状态，准备重新开始
         */
        function resetGame() {
            // 隐藏游戏结束界面
            gameOverModal.style.display = 'none';

            // 重置游戏状态
            isGameRunning = false;
            isGameOver = false;

            // 启用开始按钮
            startButton.disabled = false;

            // 清空画布
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 显示初始提示
            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('点击开始游戏', canvas.width / 2, canvas.height / 2);
        }

        // 事件监听 - 键盘按键
        document.addEventListener('keydown', function(event) {
            // 防止方向键滚动页面
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(event.keyCode) > -1) {
                event.preventDefault();
            }

            // 如果游戏未运行或已结束，不响应方向键
            if (!isGameRunning || isGameOver) {
                return;
            }

            // 根据按键改变方向（不能反向移动）
            switch (event.keyCode) {
                case 37: // 左箭头
                    if (direction !== 'right') {
                        nextDirection = 'left';
                    }
                    break;
                case 38: // 上箭头
                    if (direction !== 'down') {
                        nextDirection = 'up';
                    }
                    break;
                case 39: // 右箭头
                    if (direction !== 'left') {
                        nextDirection = 'right';
                    }
                    break;
                case 40: // 下箭头
                    if (direction !== 'up') {
                        nextDirection = 'down';
                    }
                    break;
            }
        });

        // 事件监听 - 开始按钮
        startButton.addEventListener('click', startGame);

        // 事件监听 - 重新开始按钮
        restartButton.addEventListener('click', resetGame);

        // 初始化显示
        initSnake();
        generateFood();
        draw();
    </script>
</body>
</html>
